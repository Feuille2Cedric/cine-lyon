name: Actualiser les séances et publier
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5,11,17,23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vérifier les collecteurs
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Conserver les séances déjà publiées
        env:
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/schedule.json
        run: python scripts/restore.py
      - name: Actualiser les programmes
        run: python scripts/collect.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
