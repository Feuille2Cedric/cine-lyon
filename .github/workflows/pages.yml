name: Actualiser les séances et publier
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Respecter 8h à Lyon
        id: lyon-time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Paris date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lyon-time.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.lyon-time.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.lyon-time.outputs.run == 'true'
      - name: Vérifier les collecteurs
        if: steps.lyon-time.outputs.run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Conserver les séances déjà publiées
        if: steps.lyon-time.outputs.run == 'true'
        env:
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/schedule.json
        run: python scripts/restore.py
      - name: Actualiser les programmes
        if: steps.lyon-time.outputs.run == 'true'
        run: python scripts/collect.py
      - uses: actions/configure-pages@v5
        if: steps.lyon-time.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.lyon-time.outputs.run == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.lyon-time.outputs.run == 'true'
        id: deployment
